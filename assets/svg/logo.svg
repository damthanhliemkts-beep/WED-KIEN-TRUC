<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none" role="img" aria-label="Living Blueprint monogram">
  <title>Living Blueprint</title>

  <!-- Accent baseline — architectural ground line -->
  <line x1="10" y1="62" x2="62" y2="62" stroke="#A8865C" stroke-width="1" stroke-linecap="square"/>

  <!-- Letter L -->
  <line x1="10" y1="18" x2="10" y2="54" stroke="#1A1916" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="10" y1="54" x2="28" y2="54" stroke="#1A1916" stroke-width="2.5" stroke-linecap="square"/>

  <!-- Letter B -->
  <line x1="36" y1="18" x2="36" y2="54" stroke="#1A1916" stroke-width="2.5" stroke-linecap="square"/>
  <!-- B upper bump -->
  <path d="M 36 18 L 52 18 Q 60 18 60 27 Q 60 35 36 36"
        stroke="#1A1916" stroke-width="2" stroke-linecap="square" fill="none"/>
  <!-- B lower bump -->
  <path d="M 36 36 L 54 36 Q 64 36 64 45 Q 64 54 36 54"
        stroke="#1A1916" stroke-width="2" stroke-linecap="square" fill="none"/>
</svg>
